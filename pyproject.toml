[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llm-agent-failure-research"
version = "0.1.0"
description = "Lightweight Telemetry-Based Failure Prediction and Adaptive Prevention Policies for LLM Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Research Team"}
]

dependencies = [
    # LLM and Agent Framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",

    # Data and ML
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "scipy>=1.11.0",

    # Datasets
    "datasets>=2.14.0",
    "huggingface-hub>=0.17.0",

    # Embeddings / Semantic Features
    "sentence-transformers>=2.2.0",

    # Visualization (static figures only)
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Configuration
    "pyyaml>=6.0",
    "pydantic>=2.0.0",

    # HTTP / API
    "requests>=2.31.0",
    "httpx>=0.25.0",

    # Utilities
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "jsonlines>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
lightgbm = [
    "lightgbm>=4.0.0",
]

[tool.setuptools.packages.find]
include = [
    "agent*",
    "benchmarks*",
    "counterfactual*",
    "evaluation*",
    "failure_injection*",
    "failure_taxonomy*",
    "features*",
    "labels*",
    "models*",
    "policy*",
    "telemetry*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
